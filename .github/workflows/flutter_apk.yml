name: Build APK (Lightweight)

on:
  workflow_dispatch:
  push:
    branches: ["main", "barcode-scan-feature", "expense-tracker"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get
      # ✅ Recreate your keystore from GitHub Secret
      - name: Setup keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > ~/.android/debug.keystore

      # ✅ (Optional but useful) Check keystore exists
      - name: Verify keystore
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            echo "Keystore found ✅"
          else
            echo "Keystore missing ❌"
            exit 1
          fi
      # 🟢 LIGHTWEIGHT BUILD (your requirement)
      - name: Build APK (fast profile build)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
