name: Compile Local Redactor APK
on:
  push:
    branches: [ python-redactor ]

jobs:
  build:
    runs-on: ubuntu-22.04  # Explicitly locks to a stable, highly compatible system environment

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          python3-virtualenv \
          unzip \
          zip

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0"

    - name: Run Buildozer Compilation
      run: |
        cd python_app
        # Automatically accept the Google Android SDK/NDK licensing conditions
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        buildozer android debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Local-Redactor-Android-App
        path: python_app/bin/*.apk
