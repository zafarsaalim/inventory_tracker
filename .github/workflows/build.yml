name: Build APK

on:
  push:
    branches:
      - main
      - python-version

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2️⃣ Set up Java (required for Android Gradle)
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # 3️⃣ Install Android SDK + build tools
    - name: Install Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools: 33.0.2

    # 4️⃣ Cache Gradle dependencies for speed
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    # 5️⃣ Build APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # 6️⃣ Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: inventory-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
