name: Compile Local Redactor APK
on:
  push:
    branches: [ python-redactor ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          python3-virtualenv \
          unzip \
          zip \
          zlib1g:i386 \
          libncurses5:i386 \
          libstdc++6:i386

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0"

    - name: Cache Android SDK/NDK and Buildozer Outputs
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          python_app/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('python_app/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Run Buildozer Compilation with Verbose Logging
      run: |
        cd python_app
        # Force licenses to accept automatically
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # Run with log_level = 2 (verbose output) to see exactly what is happening
        yes | buildozer -v android debug
        
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Local-Redactor-Android-App
        path: python_app/bin/*.apk
